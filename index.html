    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>V. Kamesh — Java & Distributed Systems Developer</title>
    <meta name="description" content="Portfolio of V. Kamesh — Java Developer, MCA Graduate (CGPA 8.48) specializing in high-performance enterprise Java, secure architectures (Aegis Gateway), and distributed blockchain systems." />
    <meta name="theme-color" content="#07080b" id="theme-color-meta" />

    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="V. Kamesh — Java & Distributed Systems Developer" />
    <meta property="og:description" content="Detail-oriented Java Developer (MCA CGPA 8.48) specializing in enterprise Java, Aegis Gateway military-grade security, and decentralized ledgers." />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="V. Kamesh — Java & Distributed Systems Developer" />

    <!-- Performance: Critical Asset Preloads & Preconnects -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin>
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin>
    <link rel="preload" as="image" href="/kamesh-portrait.jpg" fetchpriority="high">

    <!-- Premium Typography -->
    <link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@500,600,700,800,900&f[]=clash-display@500,600,700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">

    <!-- Anti-FOUC Theme Initialization Script -->
    <script>
      (function() {
        try {
          var savedMode = localStorage.getItem('vk_theme_mode') || 'dark';
          var savedAccent = localStorage.getItem('vk_theme_accent') || 'gold';
          var root = document.documentElement;
          
          if (savedMode === 'light') {
            root.classList.remove('dark');
            root.classList.add('light-mode');
            root.setAttribute('data-theme', 'light');
            var meta = document.getElementById('theme-color-meta');
            if (meta) meta.setAttribute('content', '#f8fafc');
          } else {
            root.classList.add('dark');
            root.classList.remove('light-mode');
            root.setAttribute('data-theme', 'dark');
            var meta = document.getElementById('theme-color-meta');
            if (meta) meta.setAttribute('content', '#07080b');
          }
          root.setAttribute('data-accent', savedAccent);
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-obsidian-950 text-slate-100 font-sans antialiased selection:bg-champagne-500/20 selection:text-champagne-400">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
